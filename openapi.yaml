openapi: 3.2.0
info:
  title: Blockchain Signer Vault Plugin API
  version: 1.0.0
  description: Manage signing keys and sign data through a Vault secrets engine mounted at signer.
servers:
  - url: http://localhost:8200
security:
  - VaultToken: []
paths:
  /v1/signer/keys:
    post:
      tags: [Keys]
      summary: Create a key
      requestBody:
        $ref: '#/components/requestBodies/CreateKey'
      responses:
        '200':
          $ref: '#/components/responses/KeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Keys]
      summary: List key IDs
      responses:
        '200':
          $ref: '#/components/responses/KeyList'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      tags: [Keys]
      summary: Read public key details
      responses:
        '200':
          $ref: '#/components/responses/KeyRead'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Keys]
      summary: Delete a key
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/hash:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing]
      summary: Sign a pre-computed hash
      requestBody:
        $ref: '#/components/requestBodies/SignHash'
      responses:
        '200':
          $ref: '#/components/responses/Signature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/batch:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing]
      summary: Sign hex hashes
      requestBody:
        $ref: '#/components/requestBodies/SignBatch'
      responses:
        '200':
          $ref: '#/components/responses/Signatures'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/message:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing]
      summary: Hash and sign bytes
      requestBody:
        $ref: '#/components/requestBodies/SignMessage'
      responses:
        '200':
          $ref: '#/components/responses/Signature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/ethereum/transaction:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing, Ethereum]
      summary: Sign an Ethereum transaction
      description: Requires a secp256k1 key. Returns transaction accepted by eth_sendRawTransaction.
      requestBody:
        $ref: '#/components/requestBodies/SignEthereumTransaction'
      responses:
        '200':
          $ref: '#/components/responses/EthereumTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/ethereum/typed-data:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing, Ethereum]
      summary: Sign EIP-712 typed data
      description: Requires a secp256k1 key. Compatible with eth_signTypedData_v4.
      requestBody:
        $ref: '#/components/requestBodies/SignEthereumTypedData'
      responses:
        '200':
          $ref: '#/components/responses/EthereumSignature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/signer/keys/{id}/sign/ethereum/user-operation:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Signing, Ethereum]
      summary: Sign an ERC-4337 UserOperation
      description: Requires a secp256k1 key. Supports EntryPoint 0.7, 0.8, and 0.9.
      requestBody:
        $ref: '#/components/requestBodies/SignEthereumUserOperation'
      responses:
        '200':
          $ref: '#/components/responses/EthereumSignature'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    VaultToken:
      type: apiKey
      in: header
      name: X-Vault-Token
  parameters:
    KeyID:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/KeyID'
  requestBodies:
    CreateKey:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateKeyRequest'
    SignHash:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignHashRequest'
    SignBatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignBatchRequest'
    SignMessage:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignMessageRequest'
    SignEthereumTransaction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EthereumTransactionRequest'
    SignEthereumTypedData:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EIP712TypedDataRequest'
    SignEthereumUserOperation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EthereumUserOperationRequest'
  responses:
    KeyCreated:
      description: Key created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultKeyCreatedResponse'
    KeyList:
      description: Key IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultKeyListResponse'
    KeyRead:
      description: Public key details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultKeyReadResponse'
    Deleted:
      description: Key deleted.
    Signature:
      description: Signature created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultSignatureResponse'
    Signatures:
      description: Signatures created in request order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultSignaturesResponse'
    EthereumTransaction:
      description: Signed transaction created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultEthereumTransactionResponse'
    EthereumSignature:
      description: Ethereum signature created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultEthereumSignatureResponse'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultErrorResponse'
    NotFound:
      description: Key not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultErrorResponse'
  schemas:
    KeyID:
      type: string
      minLength: 1
      description: Key identifier.
    Curve:
      type: string
      enum: [secp256k1, ed25519, p256]
    Hex:
      type: string
      pattern: '^[0-9a-fA-F]+$'
      description: Hexadecimal string without 0x prefix.
    HexData:
      type: string
      pattern: '^0x[0-9a-fA-F]*$'
      description: '0x-prefixed hexadecimal bytes.'
    EthereumQuantity:
      type: string
      pattern: '^0x(0|[1-9a-fA-F][0-9a-fA-F]*)$'
      description: Ethereum JSON-RPC hexadecimal quantity.
    EthereumAddress:
      type: string
      pattern: '^0x[0-9a-fA-F]{40}$'
      description: 20-byte Ethereum address.
    CreateKeyRequest:
      type: object
      required: [id, curve]
      properties:
        id:
          $ref: '#/components/schemas/KeyID'
        curve:
          $ref: '#/components/schemas/Curve'
        metadata:
          type: object
          additionalProperties:
            type: string
    SignHashRequest:
      type: object
      required: [hash]
      properties:
        hash:
          type: string
          description: Pre-computed hash encoded according to encoding.
        encoding:
          type: string
          default: hex
          enum: [hex, base32, base58, base64url]
          description: Encoding used for hash.
    SignBatchRequest:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          minItems: 1
          items:
            type: string
        encoding:
          type: string
          default: hex
          enum: [hex, base32, base58, base64url]
          description: Encoding used for each hash.
    SignMessageRequest:
      type: object
      required: [message, hash_function]
      properties:
        message:
          type: string
          description: Message encoded according to encoding.
        encoding:
          type: string
          default: text
          enum: [text, hex, base32, base58, base64url]
          description: Encoding used for message. text is UTF-8.
        hash_function:
          type: string
          enum: [sha256, keccak256, sha512, sha3-256]
    EthereumTransactionRequest:
      oneOf:
        - $ref: '#/components/schemas/LegacyEthereumTransactionRequest'
        - $ref: '#/components/schemas/EIP1559EthereumTransactionRequest'
    LegacyEthereumTransactionRequest:
      type: object
      required: [type, nonce, gas, gasPrice, chainId]
      properties:
        type:
          type: string
          enum: ['0x0']
        nonce:
          $ref: '#/components/schemas/EthereumQuantity'
        to:
          $ref: '#/components/schemas/EthereumAddress'
        value:
          $ref: '#/components/schemas/EthereumQuantity'
        gas:
          $ref: '#/components/schemas/EthereumQuantity'
        gasPrice:
          $ref: '#/components/schemas/EthereumQuantity'
        chainId:
          $ref: '#/components/schemas/EthereumQuantity'
        data:
          $ref: '#/components/schemas/HexData'
    EIP1559EthereumTransactionRequest:
      type: object
      required: [type, nonce, gas, maxPriorityFeePerGas, maxFeePerGas, chainId]
      properties:
        type:
          type: string
          enum: ['0x2']
        nonce:
          $ref: '#/components/schemas/EthereumQuantity'
        to:
          $ref: '#/components/schemas/EthereumAddress'
        value:
          $ref: '#/components/schemas/EthereumQuantity'
        gas:
          $ref: '#/components/schemas/EthereumQuantity'
        maxPriorityFeePerGas:
          $ref: '#/components/schemas/EthereumQuantity'
        maxFeePerGas:
          $ref: '#/components/schemas/EthereumQuantity'
        chainId:
          $ref: '#/components/schemas/EthereumQuantity'
        data:
          $ref: '#/components/schemas/HexData'
    EIP712TypedDataRequest:
      type: object
      required: [types, primaryType, domain, message]
      properties:
        types:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/EIP712TypeField'
        primaryType:
          type: string
          minLength: 1
        domain:
          type: object
          additionalProperties: true
        message:
          type: object
          additionalProperties: true
    EIP712TypeField:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
    EthereumUserOperationRequest:
      type: object
      required: [userOperation, entryPoint, entryPointVersion, chainId]
      properties:
        userOperation:
          $ref: '#/components/schemas/UserOperation'
        entryPoint:
          $ref: '#/components/schemas/EthereumAddress'
        entryPointVersion:
          type: string
          enum: ['0.7', '0.8', '0.9']
        chainId:
          $ref: '#/components/schemas/EthereumQuantity'
    UserOperation:
      type: object
      required:
        - sender
        - nonce
        - callData
        - callGasLimit
        - verificationGasLimit
        - preVerificationGas
        - maxFeePerGas
        - maxPriorityFeePerGas
      properties:
        sender:
          $ref: '#/components/schemas/EthereumAddress'
        nonce:
          $ref: '#/components/schemas/EthereumQuantity'
        factory:
          $ref: '#/components/schemas/EthereumAddress'
        factoryData:
          $ref: '#/components/schemas/HexData'
        callData:
          $ref: '#/components/schemas/HexData'
        callGasLimit:
          $ref: '#/components/schemas/EthereumQuantity'
        verificationGasLimit:
          $ref: '#/components/schemas/EthereumQuantity'
        preVerificationGas:
          $ref: '#/components/schemas/EthereumQuantity'
        maxFeePerGas:
          $ref: '#/components/schemas/EthereumQuantity'
        maxPriorityFeePerGas:
          $ref: '#/components/schemas/EthereumQuantity'
        paymaster:
          $ref: '#/components/schemas/EthereumAddress'
        paymasterVerificationGasLimit:
          $ref: '#/components/schemas/EthereumQuantity'
        paymasterPostOpGasLimit:
          $ref: '#/components/schemas/EthereumQuantity'
        paymasterData:
          $ref: '#/components/schemas/HexData'
    KeyCreatedData:
      type: object
      required: [id, curve, public_key, metadata]
      properties:
        id:
          $ref: '#/components/schemas/KeyID'
        curve:
          $ref: '#/components/schemas/Curve'
        public_key:
          $ref: '#/components/schemas/Hex'
        metadata:
          type: object
          additionalProperties:
            type: string
    KeyReadData:
      allOf:
        - $ref: '#/components/schemas/KeyCreatedData'
        - type: object
          required: [key_type, created_at, updated_at]
          properties:
            key_type:
              type: string
              enum: [EC, OKP]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    KeyListData:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyID'
    SignatureData:
      type: object
      required: [signature]
      properties:
        signature:
          $ref: '#/components/schemas/Hex'
    EthereumSignatureData:
      type: object
      required: [signature]
      properties:
        signature:
          $ref: '#/components/schemas/HexData'
    SignaturesData:
      type: object
      required: [signatures]
      properties:
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/Hex'
    EthereumTransactionData:
      type: object
      required: [signed_transaction, transaction_hash]
      properties:
        signed_transaction:
          $ref: '#/components/schemas/HexData'
        transaction_hash:
          type: string
          pattern: '^0x[0-9a-fA-F]{64}$'
    VaultResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data: {}
    VaultKeyCreatedResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/KeyCreatedData'
    VaultKeyReadResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/KeyReadData'
    VaultKeyListResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/KeyListData'
    VaultSignatureResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SignatureData'
    VaultEthereumSignatureResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EthereumSignatureData'
    VaultSignaturesResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SignaturesData'
    VaultEthereumTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/VaultResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EthereumTransactionData'
    VaultErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string
